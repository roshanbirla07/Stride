name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
        working-directory: mobile
      - name: Generate Android native project
        run: CI=1 npx expo prebuild --platform android
        working-directory: mobile
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: mobile/android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stride-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install -r mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.roshanbirla.stridepilot 1
            sleep 8
            adb shell pidof com.roshanbirla.stridepilot | grep -E '[0-9]'
